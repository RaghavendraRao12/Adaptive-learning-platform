<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Adaptive Learning Platform</title>
    <!-- Ensure this stylesheet path matches your public folder structure -->
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <header class="navbar">
        <h2>Adaptive Learning Platform</h2>
    </header>

    <main class="main-container" style="max-width: 450px; margin: 80px auto;">
        <div class="card">
            <h1 style="font-size: 1.5rem; margin-bottom: 6px;">Welcome Back</h1>
            <p style="color: var(--text-muted); margin-bottom: 25px;">Log in to access your adaptive learning dashboard.</p>

            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="john@example.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-primary" style="margin-top: 10px;">Login</button>
            </form>
            
            <div id="error-msg" style="color: #ef4444; font-size: 0.875rem; margin-top: 15px; text-align: center; display: none;"></div>
        </div>
    </main>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();
                if (data.success) {
                    localStorage.setItem('user', JSON.stringify(data.user));
                    window.location.href = '/dashboard.html';
                } else {
                    errorMsg.textContent = data.message || 'Invalid email or password.';
                    errorMsg.style.display = 'block';
                }
            } catch (err) {
                console.error('Login error:', err);
                errorMsg.textContent = 'Server connection error.';
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>
</html>
