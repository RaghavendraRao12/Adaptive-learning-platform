<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Adaptive Learning Platform</title>
    <style>
        :root {
            --primary-color: #0066cc;
            --primary-hover: #0052a3;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            line-height: 1.5;
        }

        .navbar {
            background: var(--card-bg);
            padding: 16px 40px;
            box-shadow: var(--shadow-sm);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .navbar h2 {
            font-size: 1.3rem;
            font-weight: 700;
        }

        .dashboard-container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .welcome-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .welcome-section h1 {
            font-size: 1.8rem;
            color: var(--text-dark);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 35px;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
        }

        .stat-card .label {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-card .value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-top: 5px;
        }

        .section-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 15px;
            color: var(--text-dark);
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .history-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px 25px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .history-card:hover {
            box-shadow: var(--shadow-md);
        }

        .history-info h3 {
            font-size: 1.1rem;
            color: var(--text-dark);
            margin-bottom: 4px;
        }

        .history-info p {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .history-stats {
            text-align: right;
            min-width: 130px;
        }

        .accuracy-badge {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--primary-color);
        }

        .tier-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-top: 4px;
        }

        .tier-Advanced { background: #dcfce7; color: #15803d; }
        .tier-Intermediate { background: #e0f2fe; color: #0369a1; }
        .tier-Remedial { background: #fee2e2; color: #b91c1c; }

        .btn-primary {
            background-color: var(--primary-color);
            color: #ffffff;
            border: none;
            padding: 12px 22px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: background-color 0.2s ease;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-danger {
            background: #ef4444;
            color: #ffffff;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.875rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .btn-outline {
            background: transparent;
            color: var(--primary-color);
            border: 1px solid var(--primary-color);
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.2s ease;
        }

        .btn-outline:hover {
            background-color: #f0f7ff;
        }
    </style>
</head>
<body>
    <header class="navbar">
        <h2>Adaptive Learning Platform</h2>
        <button id="logout-btn" class="btn-danger">Logout</button>
    </header>

    <main class="dashboard-container">
        <!-- Welcome Header -->
        <div class="welcome-section">
            <h1 id="user-welcome">Welcome Back!</h1>
            <a href="/select-topic.html" class="btn-primary">Take New Quiz</a>
        </div>

        <!-- Performance Stats Row -->
        <h2 class="section-title">Performance Overview</h2>
        <div class="stats-grid">
            <div class="stat-card">
                <div class="label">Total Quizzes Taken</div>
                <div id="stat-total-quizzes" class="value">0</div>
            </div>
            <div class="stat-card">
                <div class="label">Average Accuracy</div>
                <div id="stat-avg-accuracy" class="value">0%</div>
            </div>
        </div>

        <!-- Complete Quiz History -->
        <h2 class="section-title">Complete Quiz History</h2>
        <div id="history-container" class="history-list">
            <p style="color: var(--text-muted);">Loading quiz history...</p>
        </div>
    </main>

    <script>
        const user = JSON.parse(localStorage.getItem('user'));
        if (!user) {
            window.location.href = '/index.html';
        } else {
            document.getElementById('user-welcome').textContent = `Welcome, ${user.name || 'Student'}`;
        }

        document.getElementById('logout-btn').addEventListener('click', () => {
            localStorage.removeItem('user');
            window.location.href = '/index.html';
        });

        async function loadDashboardData() {
            try {
                const statsRes = await fetch(`/api/quiz/overall/${user.id}`);
                const statsData = await statsRes.json();
                if (statsData.success) {
                    document.getElementById('stat-total-quizzes').textContent = statsData.totalQuizzes;
                    document.getElementById('stat-avg-accuracy').textContent = `${statsData.avgAccuracy}%`;
                }

                const historyRes = await fetch(`/api/quiz/history/${user.id}`);
                const historyData = await historyRes.json();

                const container = document.getElementById('history-container');
                if (historyData.success && historyData.history.length > 0) {
                    container.innerHTML = historyData.history.map(item => `
                        <div class="history-card">
                            <div class="history-info">
                                <h3>${item.subject} &rsaquo; ${item.topic}</h3>
                                <p>Taken on: ${item.date}</p>
                                <div style="margin-top: 6px;">
                                    ${item.material}
                                </div>
                            </div>
                            <div class="history-stats">
                                <div class="accuracy-badge">${item.accuracy}%</div>
                                <div><span class="tier-badge tier-${item.tier}">${item.tier}</span></div>
                            </div>
                        </div>
                    `).map(str => str.replace(/<a /g, '<a class="btn-outline" ')).join('');
                } else {
                    container.innerHTML = '<p style="color: var(--text-muted);">No quiz history recorded yet. Take your first quiz!</p>';
                }
            } catch (err) {
                console.error('Error loading dashboard:', err);
            }
        }

        loadDashboardData();
    </script>
</body>
</html>
