<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Topic - Adaptive Learning Platform</title>
    <style>
        :root {
            --primary-color: #0066cc;
            --primary-hover: #0052a3;
            --bg-color: #f0fdf4; /* Updated soft background */
            --card-bg: #ffffff;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            line-height: 1.5;
        }

        .navbar {
            background: var(--card-bg);
            padding: 16px 40px;
            box-shadow: var(--shadow-sm);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .navbar h2 {
            font-size: 1.3rem;
            font-weight: 700;
        }

        .main-container {
            max-width: 550px;
            margin: 60px auto;
            padding: 0 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 35px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-dark);
            font-size: 0.95rem;
        }

        .form-control {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            background-color: #fff;
            color: var(--text-dark);
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.1);
        }

        .btn-start-quiz {
            background-color: var(--primary-color);
            color: #ffffff;
            border: none;
            padding: 14px 20px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            box-shadow: 0 2px 4px rgba(0, 102, 204, 0.2);
            transition: all 0.2s ease;
        }

        .btn-start-quiz:hover:not(:disabled) {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(0, 102, 204, 0.3);
        }

        .btn-start-quiz:disabled {
            background-color: #cbd5e1;
            box-shadow: none;
            cursor: not-allowed;
        }

        .btn-link {
            text-decoration: none;
            color: var(--primary-color);
            font-weight: 600;
        }
    </style>
</head>
<body>
    <header class="navbar">
        <h2>Adaptive Learning Platform</h2>
        <a href="/dashboard.html" class="btn-link">Dashboard</a>
    </header>

    <main class="main-container">
        <div class="card">
            <h1 style="font-size: 1.5rem; margin-bottom: 8px;">Choose Your Assessment Path</h1>
            <p style="color: var(--text-muted); margin-bottom: 25px; font-size: 0.95rem;">Select a subject and topic to begin your assessment session.</p>

            <div class="form-group">
                <label for="subject-select">1. Select Subject:</label>
                <select id="subject-select" class="form-control">
                    <option value="">-- Choose a Subject --</option>
                </select>
            </div>

            <div class="form-group">
                <label for="topic-select">2. Select Topic:</label>
                <select id="topic-select" class="form-control" disabled>
                    <option value="">-- Select Subject First --</option>
                </select>
            </div>

            <button id="start-quiz-btn" class="btn-start-quiz" disabled>Start Quiz</button>
        </div>
    </main>

    <script>
        const user = JSON.parse(localStorage.getItem('user'));
        if (!user) window.location.href = '/index.html';

        const subjectSelect = document.getElementById('subject-select');
        const topicSelect = document.getElementById('topic-select');
        const startBtn = document.getElementById('start-quiz-btn');

        async function loadSubjects() {
            try {
                const res = await fetch('/api/quiz/subjects');
                const data = await res.json();
                if (data.success) {
                    data.subjects.forEach(subject => {
                        const opt = document.createElement('option');
                        opt.value = subject;
                        opt.textContent = subject;
                        subjectSelect.appendChild(opt);
                    });
                }
            } catch (err) {
                console.error('Error fetching subjects:', err);
            }
        }

        subjectSelect.addEventListener('change', async () => {
            const selectedSubject = subjectSelect.value;
            topicSelect.innerHTML = '<option value="">-- Select a Topic --</option>';
            startBtn.disabled = true;

            if (!selectedSubject) {
                topicSelect.disabled = true;
                return;
            }

            try {
                const res = await fetch(`/api/quiz/topics/${encodeURIComponent(selectedSubject)}`);
                const data = await res.json();
                if (data.success && data.topics.length > 0) {
                    data.topics.forEach(topic => {
                        const opt = document.createElement('option');
                        opt.value = topic.topic_id;
                        opt.textContent = topic.topic_name;
                        topicSelect.appendChild(opt);
                    });
                    topicSelect.disabled = false;
                }
            } catch (err) {
                console.error('Error fetching topics:', err);
            }
        });

        topicSelect.addEventListener('change', () => {
            startBtn.disabled = !topicSelect.value;
        });

        startBtn.addEventListener('click', () => {
            const topicId = topicSelect.value;
            if (topicId) {
                window.location.href = `/quiz.html?topicId=${topicId}`;
            }
        });

        loadSubjects();
    </script>
</body>
</html>
