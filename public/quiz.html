<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assessment - Adaptive Learning Platform</title>
    <style>
        :root {
            --primary-color: #0066cc;
            --primary-hover: #0052a3;
            --bg-color: #f0fdf4; /* Updated soft background */
            --card-bg: #ffffff;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            line-height: 1.5;
        }

        .navbar {
            background: var(--card-bg);
            padding: 16px 40px;
            box-shadow: var(--shadow-sm);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .navbar h2 {
            font-size: 1.3rem;
            font-weight: 700;
        }

        .quiz-wrapper {
            max-width: 650px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .quiz-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 30px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
        }

        .option-card {
            display: flex;
            align-items: center;
            padding: 14px 18px;
            margin-bottom: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            background: #fafbfc;
        }

        .option-card:hover {
            border-color: var(--primary-color);
            background: #f0f7ff;
        }

        .option-card input[type="radio"] {
            margin-right: 12px;
            accent-color: var(--primary-color);
            transform: scale(1.1);
        }

        .quiz-progress-bar-container {
            width: 100%;
            background: #e2e8f0;
            border-radius: 6px;
            height: 8px;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .quiz-progress-bar-fill {
            height: 100%;
            background: var(--primary-color);
            width: 10%;
            transition: width 0.3s ease;
        }

        .quiz-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: background 0.2s;
        }

        .quiz-btn:hover {
            background-color: var(--primary-hover);
        }

        .btn-link {
            text-decoration: none;
            color: var(--primary-color);
            font-weight: 600;
        }

        .timer-badge {
            font-size: 0.9rem;
            font-weight: 600;
            padding: 4px 10px;
            background: #fee2e2;
            color: #b91c1c;
            border-radius: 20px;
        }
    </style>
</head>
<body>
    <header class="navbar">
        <h2>Adaptive Quiz Assessment</h2>
        <a href="/dashboard.html" class="btn-link">Dashboard</a>
    </header>

    <main class="quiz-wrapper">
        <!-- Quiz Questions Box -->
        <div id="quiz-box" class="quiz-card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3 id="quiz-header" style="margin: 0; font-size: 1.2rem; color: #1e293b;">Assessment Session</h3>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <span id="timer-display" class="timer-badge">--:--</span>
                    <span id="question-counter" style="font-weight: 600; color: #0066cc;">Q1/10</span>
                </div>
            </div>

            <!-- Visual Progress Bar -->
            <div class="quiz-progress-bar-container">
                <div id="progress-fill" class="quiz-progress-bar-fill"></div>
            </div>

            <div id="question-container" style="margin: 20px 0;">
                <p id="question-text" style="font-size: 1.15rem; font-weight: 600; margin-bottom: 20px; line-height: 1.5;"></p>
                <div id="options-list"></div>
            </div>
            <button id="submit-ans-btn" class="quiz-btn">Submit Answer</button>
        </div>

        <!-- Result & Recommendation Panel -->
        <div id="result-panel" class="quiz-card" style="display: none; text-align: center;">
            <h3 style="color: #2e7d32; margin-bottom: 10px;">Quiz Completed Successfully!</h3>
            <p id="final-score-text" style="margin: 15px 0; font-size: 2rem; color: #0066cc; font-weight: bold;"></p>
            <div id="adaptation-feedback" style="background: #f0f7ff; padding: 20px; border-radius: 8px; margin-bottom: 25px; text-align: left; border: 1px solid #b6e0fe;"></div>
            <a href="/dashboard.html" class="quiz-btn" style="text-decoration: none; display: inline-block; box-sizing: border-box;">Return to Dashboard</a>
        </div>
    </main>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const topicId = urlParams.get('topicId');
        const user = JSON.parse(localStorage.getItem('user'));
        if (!user) window.location.href = '/index.html';

        let questions = [];
        let currentQuestionIndex = 0;
        let scoreCount = 0;
        let timerInterval = null;
        let timeLeft = 0;

        const questionText = document.getElementById('question-text');
        const optionsList = document.getElementById('options-list');
        const submitBtn = document.getElementById('submit-ans-btn');
        const quizBox = document.getElementById('quiz-box');
        const resultPanel = document.getElementById('result-panel');
        const finalScoreText = document.getElementById('final-score-text');
        const adaptationFeedback = document.getElementById('adaptation-feedback');
        const quizHeader = document.getElementById('quiz-header');
        const questionCounter = document.getElementById('question-counter');
        const progressFill = document.getElementById('progress-fill');
        const timerDisplay = document.getElementById('timer-display');

        async function fetchQuestions() {
            if (!topicId) {
                quizHeader.textContent = "Error: No topic selected.";
                submitBtn.style.display = 'none';
                return;
            }
            try {
                const res = await fetch(`/api/quiz/questions/${topicId}/${user.id}`);
                const data = await res.json();
                
                if (data.success && data.questions.length > 0) {
                    questions = data.questions;
                    quizHeader.textContent = "Assessment Session";
                    loadQuestion();
                } else {
                    quizHeader.textContent = "No questions found for this topic.";
                    submitBtn.style.display = 'none';
                }
            } catch (err) {
                console.error('Error fetching questions:', err);
                quizHeader.textContent = "Error loading questions.";
            }
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        function startTimer(difficulty) {
            clearInterval(timerInterval);

            // 5 mins for remedial, 3 mins for medium, 1 min for hard
            if (difficulty === 'Advanced' || difficulty === 'Hard') {
                timeLeft = 60; // 1 minute
            } else if (difficulty === 'Intermediate' || difficulty === 'Medium') {
                timeLeft = 180; // 3 minutes
            } else {
                timeLeft = 300; // 5 minutes for Remedial / Easy
            }

            timerDisplay.textContent = formatTime(timeLeft);

            timerInterval = setInterval(() => {
                timeLeft--;
                timerDisplay.textContent = formatTime(timeLeft);

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    handleTimeout();
                }
            }, 1000);
        }

        function handleTimeout() {
            currentQuestionIndex++;
            loadQuestion();
        }

        function loadQuestion() {
            if (currentQuestionIndex < questions.length) {
                const q = questions[currentQuestionIndex];
                questionCounter.textContent = `Q${currentQuestionIndex + 1}/${questions.length}`;
                
                const progressPct = ((currentQuestionIndex + 1) / questions.length) * 100;
                progressFill.style.width = `${progressPct}%`;

                questionText.textContent = q.question_text;
                optionsList.innerHTML = '';

                startTimer(q.difficulty);

                let options = [];
                try {
                    options = typeof q.options === 'string' ? JSON.parse(q.options) : q.options;
                } catch (e) {
                    console.error('Error parsing options JSON:', e);
                }

                options.forEach(opt => {
                    const label = document.createElement('label');
                    label.className = 'option-card';
                    label.innerHTML = `
                        <input type="radio" name="quiz-option" value="${opt}">
                        <span style="font-size: 1rem; color: #333;">${opt}</span>
                    `;
                    optionsList.appendChild(label);
                });

                submitBtn.textContent = (currentQuestionIndex === questions.length - 1) ? "Submit Quiz" : "Submit Answer";
            } else {
                clearInterval(timerInterval);
                finishQuiz();
            }
        }

        submitBtn.addEventListener('click', () => {
            const selected = document.querySelector('input[name="quiz-option"]:checked');
            if (!selected) {
                alert('Please select an option before continuing.');
                return;
            }

            clearInterval(timerInterval);

            const q = questions[currentQuestionIndex];
            if (selected.value.trim() === q.correct_opt.trim()) {
                scoreCount++;
            }

            currentQuestionIndex++;
            loadQuestion();
        });

        async function finishQuiz() {
            quizBox.style.display = 'none';
            resultPanel.style.display = 'block';

            const percentage = Math.round((scoreCount / questions.length) * 100);
            finalScoreText.textContent = `${percentage}% Accuracy (${scoreCount}/${questions.length} Correct)`;

            try {
                const response = await fetch('/api/quiz/evaluate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: user.id,
                        topicId: topicId,
                        scorePercentage: percentage
                    })
                });

                const data = await response.json();
                if (data.success) {
                    adaptationFeedback.innerHTML = `
                        <p style="margin-bottom: 10px;"><strong>Performance Tier:</strong> ${data.tier}</p>
                        <p style="margin-bottom: 10px;"><strong>Feedback:</strong> ${data.recommendation}</p>
                        <p style="margin: 0;"><strong>Recommended Resource:</strong> ${data.material}</p>
                    `;
                }
            } catch (err) {
                console.error('Evaluation error:', err);
                adaptationFeedback.innerHTML = `<p>Error saving quiz results to server.</p>`;
            }
        }

        fetchQuestions();
    </script>
</body>
</html>
